name: Release

# Runs when you push a version tag such as v1.0.0.
# Builds installers for Windows, macOS and Linux and attaches them to a GitHub Release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Create release (if it doesn't exist yet)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Recova $GITHUB_REF_NAME" --generate-notes

  build:
    name: Build ${{ matrix.name }}
    needs: create-release
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            target: --win
          - os: macos-latest
            name: macOS
            target: --mac
          - os: ubuntu-latest
            name: Linux
            target: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Typecheck & build
        run: npm run build

      # Tag pushes publish to the release; manual runs only build and upload artifacts.
      - name: Package (and publish on tags)
        run: npx electron-builder ${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds. Add signing secrets here when you have certificates
          # (CSC_LINK / CSC_KEY_PASSWORD for Windows & macOS).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Recova-${{ matrix.name }}
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.AppImage
          if-no-files-found: ignore
          retention-days: 7
